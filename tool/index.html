            height: 50px;

        .joystick{
            height: 100px;
            width: 100px;
            position: fixed;
            background: rgb(103, 200, 255);
            left: 85px;
            bottom: 76px;
            z-index: 1;
            border-radius: 50%;
            display: none;
        }
        .inner-stick{
            width: 50px;
            height: 50px;
            background: rgb(255, 215, 18);
            border-radius: 50%;
            position: absolute;
            top: calc( 50% - 25px);
            left: calc( 50% - 25px);

        function getQueryParams(query) {
            var params = (new URL(document.location)).searchParams;
            var value = params.get(query);
            return value;

        //stop browser default drop behaviour for firefox
        document.getElementById("FoyrFPCanvas").addEventListener('drop',function(e){

        var papercanvas = document.getElementById('paperCanvas');

        paper.setup(papercanvas);

        sourceProjectId = getQueryParams('project');
        sourceProjectName = "";
        sourceProjectMode = PROJECT_MODE_NORMAL;
        sourceUserId = "user_id";
        ENABLE_LIGHT_MODE = true; //(getQueryParams('light') === 'true');
